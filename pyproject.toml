[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trie-dict"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "aiosqlite",
    "pwdlib[argon2]",
    "pydantic-settings",
    "email-validator",
    "python-multipart",
    "pandas",
    "itsdangerous",
    "aiosmtplib",
]

[tool.fastapi]
entrypoint = "backend.src.main:app"
