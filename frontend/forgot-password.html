<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password · EffortList</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page">

  <main class="auth-shell">
    <a class="auth-back" href="/login">← Back to log in</a>

    <section class="auth-card" aria-labelledby="auth-title">
      <p class="auth-eyebrow">Account recovery</p>
      <h1 id="auth-title">Reset your password</h1>
      <p class="auth-intro">Enter your email and we’ll send you a secure reset link.</p>

      <form class="auth-form" id="reset-request-form" novalidate>
        <div class="auth-field">
          <label for="email">Email</label>
          <input
            class="text-input"
            id="email"
            name="email"
            type="email"
            inputmode="email"
            autocomplete="email"
            maxlength="100"
            placeholder="you@example.com"
            required
            autofocus
          >
        </div>

        <button class="action-btn auth-submit" type="submit">Send reset link</button>
        <p class="status-msg auth-status" id="auth-status" role="status" aria-live="polite"></p>
      </form>

      <p class="auth-switch">Remembered it? <a href="/login">Log in</a></p>
    </section>
  </main>

  <script type="module" src="/static/js/pages/password-reset.js?v=1"></script>
</body>
</html>
