<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose a new password · EffortList</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page">

  <main class="auth-shell">
    <a class="auth-back" href="/login">← Back to log in</a>

    <section class="auth-card" aria-labelledby="auth-title">
      <p class="auth-eyebrow">Account recovery</p>
      <h1 id="auth-title">Choose a new password</h1>
      <p class="auth-intro">Use a password you haven't used for this account before.</p>

      <form class="auth-form" id="reset-password-form" novalidate>
        <div class="auth-field">
          <label for="password">New password</label>
          <div class="password-field">
            <input
              class="text-input"
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              maxlength="100"
              placeholder="At least 8 characters"
              required
              autofocus
            >
            <button class="password-toggle" type="button" aria-label="Show passwords">Show</button>
          </div>
          <p class="field-hint">Use 8-100 characters.</p>
        </div>

        <div class="auth-field">
          <label for="password-confirmation">Confirm new password</label>
          <input
            class="text-input"
            id="password-confirmation"
            name="password_confirmation"
            type="password"
            autocomplete="new-password"
            minlength="8"
            maxlength="100"
            placeholder="Repeat your new password"
            required
          >
        </div>

        <button class="action-btn auth-submit" type="submit">Reset password</button>
        <p class="status-msg auth-status" id="auth-status" role="status" aria-live="polite"></p>
      </form>

      <p class="auth-switch">Need another link? <a href="/forgot-password">Request one</a></p>
    </section>
  </main>

  <script type="module" src="/static/js/pages/password-reset.js?v=1"></script>
</body>
</html>
